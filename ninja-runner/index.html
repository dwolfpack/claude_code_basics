<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta http-equiv="refresh" content="2;url=https://dwolfpack.github.io/shadow-step/" />
<link rel="canonical" href="https://dwolfpack.github.io/shadow-step/" />
<title>Shadow Step has moved</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(120% 80% at 50% 0%, #2a1748, #120a1e 60%, #090512);
    color: #f4efff; font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif; text-align: center;
  }
  .card { max-width: 380px; }
  .mark { font-size: 3rem; }
  h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; margin: 14px 0 10px; }
  p { color: #b7abd0; line-height: 1.6; font-size: 0.92rem; margin: 0 0 22px; }
  a.go {
    display: inline-block; padding: 14px 26px; border-radius: 16px; text-decoration: none;
    font-weight: 800; color: #1a0f00; background: linear-gradient(135deg, #ffe08a, #ffcf5c 55%, #f0a93c);
    box-shadow: 0 10px 26px rgba(255, 207, 92, 0.28);
  }
</style>
<script>
(function () {
  var target = 'https://dwolfpack.github.io/shadow-step/' + window.location.search + window.location.hash;
  var link = function () { var a = document.getElementById('go'); if (a) a.href = target; };
  // Retire the old service worker and its cache, or it keeps serving the old game.
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
    }
  } catch (e) { /* ignore */ }
  document.addEventListener('DOMContentLoaded', link);
  setTimeout(function () { window.location.replace(target); }, 600);
})();
</script>
</head>
<body>
  <div class="card">
    <div class="mark">🥷</div>
    <h1>Shadow Step has moved</h1>
    <p>The ninja now runs in its own repository. Taking you there — challenge links keep working.</p>
    <a class="go" id="go" href="https://dwolfpack.github.io/shadow-step/">Play Shadow Step</a>
  </div>
</body>
</html>
